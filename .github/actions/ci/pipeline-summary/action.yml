name: CI - Resumo
description: Publica status dos jobs no GitHub Summary
inputs:
  python:
    description: Resultado do job CI - Python
    required: true
  workflows:
    description: Resultado do job CI - Workflows
    required: true
  release:
    description: Resultado do job CI - Release
    required: true
runs:
  using: composite
  steps:
    - name: Publicar resumo
      shell: bash
      run: |
        {
          echo "## Resumo CI"
          echo ""
          echo "| Etapa | Status |"
          echo "|-------|--------|"
          echo "| Python | ${{ inputs.python }} |"
          echo "| Workflows | ${{ inputs.workflows }} |"
          echo "| Release | ${{ inputs.release }} |"
        } >> "$GITHUB_STEP_SUMMARY"
