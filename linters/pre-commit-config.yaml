minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: commitlint
        name: Commitlint (Conventional Commits)
        entry: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --config linters/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]

      - id: python-lint
        name: Python | Lint
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage lint
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: python-security
        name: Python | Seguranca
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage security
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: python-test
        name: Python | Testes
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-validate
        name: Python | Validate
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage validate
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: python-build
        name: Python | Build
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage build
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: cleanup
        name: Limpeza (caches e artefatos locais)
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --area python --stage clean
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
